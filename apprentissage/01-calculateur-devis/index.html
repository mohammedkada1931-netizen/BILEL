<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculateur de devis toiture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="carte">
    <h1>Devis toiture</h1>
    <p class="sous-titre">Estimation rapide, sans engagement</p>

    <label for="surface">Surface de la toiture (m²)</label>
    <input type="number" id="surface" min="1" placeholder="Ex : 80">

    <label for="materiau">Type de couverture</label>
    <select id="materiau">
      <option value="45">Tuiles en terre cuite - 45 €/m²</option>
      <option value="60">Ardoises - 60 €/m²</option>
      <option value="35">Bac acier - 35 €/m²</option>
    </select>

    <label class="case">
      <input type="checkbox" id="demolition">
      Retirer l'ancienne toiture (+ 15 €/m²)
    </label>

    <button id="calculer">Calculer mon devis</button>

    <p id="resultat" class="resultat" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
